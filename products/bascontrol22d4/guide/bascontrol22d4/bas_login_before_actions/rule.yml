documentation_complete: true

title: 'Login before Taking Action'

description: |-
    You can login at {{{ weblink(link="https://bascontrol") }}}.

rationale: |-
    Requiring an authenticated login before taking action helps ensure that
    administrative changes are performed by an identified user.

severity: medium

ocil_clause: 'the user cannot log in before taking action'

ocil: |-
    Verify that the BAScontrol interface requires a user to log in before
    administrative actions can be taken. If a user can take action without
    logging in, this is a finding.
