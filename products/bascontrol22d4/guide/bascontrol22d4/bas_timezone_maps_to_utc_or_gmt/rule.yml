documentation_complete: true

title: 'Configure BAScontrol22D Timezone to Map to UTC or GMT'

description: |-
    BAScontrol22D provides a timezone selector under
    <tt>Set Time &gt; NTP Configuration</tt>. The configured timezone should map to
    UTC or GMT as required by the deployment.

rationale: |-
    Timezone configuration that maps cleanly to UTC or GMT supports consistent
    interpretation of device log timestamps across systems and locations.

severity: medium

ocil_clause: 'the BAScontrol22D timezone is not configured to map to UTC or GMT'

ocil: |-
    Access the BAScontrol22D web interface and open <tt>Set Time</tt>.

    In the <tt>NTP Configuration</tt> section, review the configured
    <tt>Time Zone</tt> value and verify it maps to UTC or GMT as required by the site.

    If the configured timezone does not map to UTC or GMT, this is a finding.
