documentation_complete: true

title: 'Enable NTP Time Synchronization'

description: |-
    BAScontrol22D provides Network Time Protocol (NTP) settings under
    <tt>Set Time &gt; NTP Configuration</tt>. NTP should be enabled and configured to
    use an approved time source.

rationale: |-
    Time synchronization supports consistent event and log timestamps and improves
    the reliability of operational and security record review.

severity: medium

ocil_clause: 'NTP is not enabled or is not configured with an approved time server'

ocil: |-
    Access the BAScontrol22D web interface and open <tt>Set Time</tt>.

    In the <tt>NTP Configuration</tt> section, verify:
    <pre>
    - NTP Enabled is selected
    - NTP Server is set to an approved time source
    - Refresh is configured according to site requirements
    </pre>

    If NTP is disabled or not configured with an approved time source, this is a finding.
