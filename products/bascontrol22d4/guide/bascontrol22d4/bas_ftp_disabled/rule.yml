documentation_complete: true

title: 'Disable FTP in BAScontrol22D'

description: |-
    BAScontrol22D exposes an FTP protocol toggle under
    <tt>System Config &gt; Admin &gt; Enable Protocol</tt>. FTP should be disabled
    unless it is explicitly required and approved for the deployment.

rationale: |-
    Disabling unused or unapproved protocols reduces attack surface and helps ensure
    the device uses only functions, ports, and protocols authorized for operation.

severity: medium

ocil_clause: 'FTP is enabled on the controller'

ocil: |-
    Access the BAScontrol22D web interface and open <tt>System Config &gt; Admin</tt>.

    In the <tt>Enable Protocol</tt> section, verify the <tt>FTP</tt> option is not selected.

    If FTP is enabled without explicit authorization, this is a finding.
